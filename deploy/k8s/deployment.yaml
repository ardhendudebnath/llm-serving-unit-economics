# vLLM serving one open-weight model.
#
# The probe configuration below is the part worth reading. A model server
# breaks every assumption the default probe settings are built on: it takes
# minutes to become useful, it stays useful while very slow, and restarting it
# is expensive rather than cheap.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-server
  labels:
    app: vllm-server
spec:
  # One replica. The plan is explicit that this is one deployment measured
  # properly, not a platform -- and a second replica would halve the GPU hours
  # available for measurement while adding nothing to the cost curves.
  replicas: 1
  strategy:
    # Rolling, but without a surge, because this node cannot hold two pods.
    #
    # maxSurge 1 / maxUnavailable 0 keeps the old pod serving while the new
    # one loads. That is the right shape for a zero-downtime deploy, and it
    # costs a second GPU for the length of the rollout. This node has one GPU
    # and about 15 GiB of memory, so the surge pod can never be scheduled.
    # Measured 2026-09-18, it sat Pending on "Insufficient memory,
    # Insufficient nvidia.com/gpu", and with maxUnavailable 0 nothing could
    # make room for it.
    #
    # maxUnavailable 1 lets a rollout finish, at the price of downtime: the old
    # pod stops before the new one has loaded and warmed, about two minutes
    # here. On a node with a spare GPU, put maxSurge 1 / maxUnavailable 0 back.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: vllm-server
  template:
    metadata:
      labels:
        app: vllm-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      # **Without this the pod gets no GPU.** k3s writes `nvidia` and
      # `nvidia-experimental` RuntimeClasses at install time, but only if
      # nvidia-container-runtime was on PATH before k3s started -- install the
      # toolkit first. A pod that omits this schedules happily and then fails
      # inside CUDA, which reads as a driver problem rather than a missing line
      # of YAML.
      runtimeClassName: nvidia

      # Weights survive pod restarts. Without this every restart re-downloads
      # several GB, which turns a 90-second start into a 35-minute one and
      # makes the startup probe budget below unmeetable.
      volumes:
        - name: model-cache
          # hostPath, not a PersistentVolumeClaim, and deliberately.
          #
          # A PVC here would be filled by k3s's local-path provisioner with an
          # *empty* directory, and the pod would re-download 8 GB it already
          # has. This path holds weights that survived the migration off
          # Docker precisely because they were never inside a container
          # engine's volume tree.
          #
          # The tradeoff is honest: hostPath pins the pod to this node, which
          # is fine for a single-node measurement cluster and would not be on a
          # real one. A multi-node deployment wants a ReadWriteMany PVC or an
          # init container that pulls from object storage.
          hostPath:
            path: /opt/llm-models
            type: Directory
        # vLLM needs more shared memory than the 64MB default for its worker
        # IPC. Too small a value surfaces as an opaque hang during load, not
        # as an error.
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi

      terminationGracePeriodSeconds: 60

      containers:
        - name: vllm
          image: ghcr.io/ardhendudebnath/llm-serving-unit-economics/vllm:v0.11.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000

          envFrom:
            - configMapRef:
                name: vllm-config

          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: dshm
              mountPath: /dev/shm

          # Sized to this node, not to a cloud GPU VM. The node is a WSL2 VM
          # with about 15.3 GiB allocatable, so the earlier request of 16 GiB
          # left the pod Pending on "Insufficient memory" with nothing wrong
          # in the pod itself. The limit leaves the node about a gigabyte for
          # k3s and the kubelet. Measured under load on 2026-09-18 (kubectl
          # top, `short` at 8 rps then `long_in` at 2 rps): 3.5 GiB, so the
          # 8 GiB request has room. The GPU request needs the device plugin
          # (nvidia-device-plugin.yaml) to be running.
          resources:
            limits:
              nvidia.com/gpu: 1
              memory: 14Gi
            requests:
              nvidia.com/gpu: 1
              memory: 8Gi
              cpu: "4"

          # --- Probes -------------------------------------------------------
          #
          # Startup probe. This is the one that makes the other two sane. It
          # suppresses liveness and readiness entirely until the model has
          # loaded, so neither of them needs a long initialDelaySeconds.
          #
          # Budget: 60 x 10s = 10 minutes. Sized for a start where the weights
          # are already on the host volume above and only CUDA graph capture
          # and KV cache profiling remain.
          #
          # **Measured 2026-09-07: a first-ever start blows straight through
          # this, and that is the intended behaviour.** Pulling the 8.04 GB
          # fp16 checkpoint ran at ~3.9 MB/s, so the download alone is ~35
          # minutes; this probe failed at 10 while the container sat healthy
          # and still downloading. The pod CrashLoops, which is visible, rather
          # than appearing to hang for forty minutes with no signal.
          #
          # The fix is not a longer budget -- it is to warm the volume once, so
          # the assumption above holds.
          #
          # **Warm start measured 2026-09-08: 122 seconds**, container start to
          # /health passing, of which 64 s was engine init and 27 s of that was
          # CUDA graph capture. Against ~35 minutes cold, that gap is the whole
          # justification for mounting weights from the host rather than
          # letting each pod fetch its own -- and it means this 10-minute
          # budget clears a warm start by roughly 5x while still failing a cold
          # one, which is exactly the behaviour wanted.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 60
            timeoutSeconds: 5

          # Readiness. Decides whether the Service sends traffic here. Fails
          # fast because a pod that cannot answer should leave the endpoint
          # list quickly -- but with failureThreshold 3, not 1, so a single
          # slow scrape during a burst does not flap the pod out of rotation.
          #
          # timeoutSeconds is 3, deliberately far below the p99 of an actual
          # completion: /health does not run inference, so if it cannot answer
          # in 3 seconds the event loop itself is blocked, which is a real
          # readiness failure rather than a slow request.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 3
            successThreshold: 1

          # Liveness. Restarts the container, so it is deliberately the least
          # sensitive of the three.
          #
          # The failure mode this guards against is a wedged process, not a
          # busy one. A saturated model server is slow, not dead, and killing
          # it under load is how a traffic spike becomes an outage: the
          # restart drops every in-flight request and takes minutes to come
          # back, during which the load shifts nowhere and the next pod dies
          # the same way.
          #
          # Hence 30s period and 6 failures -- three minutes of continuous
          # unresponsiveness before a restart. Liveness is never wired to
          # queue depth or latency for the same reason.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 6
            timeoutSeconds: 10

          lifecycle:
            # Warm up before the pod can turn Ready.
            #
            # **Ready is not warm, measured 2026-09-18.** /health passes once
            # the weights are loaded. But a batch of eight requests sent the
            # moment the pod turned Ready waited 18.1-18.8 s for a first token,
            # short and long prompts alike, and the same batch 30 s later took
            # 0.3-0.9 s. The first users after every start, restart and rollout
            # paid that.
            #
            # Kubernetes runs no probe until postStart returns, so a hook that
            # sends a few real requests first means the startup and readiness
            # probes can only pass on a warm server, and the Service never
            # routes anyone to a cold one.
            #
            # Bounded by the startup probe's own 10-minute budget, and it fails
            # loudly: if the server never becomes healthy, the hook exits
            # non-zero and the kubelet restarts the container, as the startup
            # probe would have. Its prompts are deliberately unlike real
            # traffic; what it warms is the engine, not a cache.
            postStart:
              exec:
                command:
                  - python3
                  - -c
                  - |
                    import concurrent.futures as cf, json, os, sys, time, urllib.request
                    base = "http://127.0.0.1:8000"
                    log = open("/proc/1/fd/1", "w")
                    deadline = time.time() + 600
                    while True:
                        try:
                            urllib.request.urlopen(base + "/health", timeout=3)
                            break
                        except Exception:
                            if time.time() > deadline:
                                print("warm-up: not healthy within 10 minutes", file=log, flush=True)
                                sys.exit(1)
                            time.sleep(2)
                    def ask(words, max_tokens):
                        body = json.dumps({
                            "model": os.environ["SERVED_MODEL_NAME"],
                            "max_tokens": max_tokens,
                            "messages": [{"role": "user", "content": "Warm-up request. " * words}],
                        }).encode()
                        req = urllib.request.Request(base + "/v1/chat/completions", data=body,
                                                     headers={"Content-Type": "application/json"})
                        start = time.time()
                        urllib.request.urlopen(req, timeout=300).read()
                        return round(time.time() - start, 2)
                    started = time.time()
                    for _ in range(2):
                        with cf.ThreadPoolExecutor(8) as pool:
                            took = list(pool.map(lambda a: ask(*a), [(8, 16)] * 6 + [(300, 16)] * 2))
                        print(f"warm-up batch, seconds: {took}", file=log, flush=True)
                    print(f"warm-up done in {time.time() - started:.0f} s", file=log, flush=True)
            preStop:
              # Let in-flight generations finish before SIGTERM. long_out
              # requests can run for tens of seconds, and cutting them off
              # would show up in the error rate of any sweep running across a
              # rollout.
              exec:
                command: ["sh", "-c", "sleep 15"]
