# The serving configuration under test.
#
# Kept in a ConfigMap rather than baked into the image so the quantisation
# ladder is three deploys of one image, not three images. A change here is a
# change to what was measured, so it goes through the CI quality gate like any
# other -- see .github/workflows/quality-gate.yml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-config
data:
  # The checkpoint for the precision below. Each rung is a different repo --
  # int8 and int4 are pre-quantised, not runtime flags -- so MODEL_ID and
  # PRECISION must move together. See docs/models.md and bench/config.py.
  #
  #   fp16  Qwen/Qwen3-4B-Instruct-2507                        8.04 GB
  #   int8  RedHatAI/Qwen3-4B-Instruct-2507-quantized.w8a8     5.19 GB
  #   int4  RedHatAI/Qwen3-4B-Instruct-2507-quantized.w4a16    3.43 GB
  MODEL_ID: "Qwen/Qwen3-4B-Instruct-2507"
  PRECISION: "fp16"

  # Stable across the ladder on purpose: the load generator and Project 01's
  # harness both address the server by this name, so all three rungs are
  # drop-in replacements for each other and nothing downstream has to change
  # between runs.
  SERVED_MODEL_NAME: "gst-4b"

  # Sized to the workload, not to the architecture. This model advertises
  # 262,144 positions; reserving for that would consume the whole card in KV
  # cache for context the traffic never sends.
  #
  # KV cache costs 144 KiB/token here (36 layers, 8 KV heads, head_dim 128), so
  # 4096 tokens is 0.60 GB per sequence. The long_in corpus peaks near 1,800
  # tokens, so 4096 covers the longest real prompt with room for the answer --
  # and roughly doubles the concurrent sequences that 8192 would allow.
  MAX_MODEL_LEN: "4096"

  # At fp16 the weights leave ~2.7 GB for KV cache, which is about 4 sequences
  # at 4096 tokens. 256 would be a ceiling the card can never reach, and a
  # ceiling that cannot be hit hides where the real limit is.
  MAX_NUM_SEQS: "16"

  # 0.85, not the usual 0.90, and the reason is specific to this hardware.
  #
  # vLLM reads this as a fraction of *total* VRAM, then refuses to start if
  # less than that is actually free. On this card 0.90 failed by 10 MiB:
  #
  #   Free memory on device (10.74/11.94 GiB) on startup is less than desired
  #   GPU memory utilization (0.9, 10.75 GiB)
  #
  # Two things eat the gap. The GPU also drives the display under WDDM, which
  # reserves a few hundred MiB, and vLLM measures free memory *after* creating
  # its own CUDA context, which costs several hundred more. nvidia-smi reported
  # 11,737 MiB free moments earlier -- so reading nvidia-smi and setting the
  # fraction from that is exactly how to get this wrong.
  #
  # 0.85 asks for ~10.15 GiB and leaves ~0.6 GiB of margin, which also absorbs
  # the display's demands fluctuating while a sweep runs. It costs KV cache:
  # ~2.9 GB after the fp16 weights, or roughly 4.7 concurrent sequences at
  # 4,096 tokens.
  GPU_MEMORY_UTILIZATION: "0.85"

  # Off for measurement runs. See serving/entrypoint.sh for why: the corpora
  # replay, real traffic does not, and a cached replay would report a
  # throughput no production deployment reproduces.
  ENABLE_PREFIX_CACHING: "0"
