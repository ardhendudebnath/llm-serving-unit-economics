# The serving configuration under test.
#
# Kept in a ConfigMap rather than baked into the image so the quantisation
# ladder is three deploys of one image, not three images. A change here is a
# change to what was measured, so it goes through the CI quality gate like any
# other -- see .github/workflows/quality-gate.yml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-config
data:
  # Set to the model actually being benchmarked before applying. Left as a
  # placeholder rather than a plausible default: a manifest that silently
  # serves a different model than the results claim is exactly the kind of
  # mismatch this repo exists to rule out.
  MODEL_ID: "REPLACE_ME"
  SERVED_MODEL_NAME: "served-model"

  PRECISION: "fp16"

  # Sized to the workload, not to the model's architectural maximum. The
  # long_in corpus tops out near 40,000 characters; 8192 tokens covers it with
  # room, and every token of headroom beyond that is KV cache reserved for
  # context the traffic never sends.
  MAX_MODEL_LEN: "8192"

  MAX_NUM_SEQS: "256"
  GPU_MEMORY_UTILIZATION: "0.90"

  # Off for measurement runs. See serving/entrypoint.sh for why: the corpora
  # replay, real traffic does not, and a cached replay would report a
  # throughput no production deployment reproduces.
  ENABLE_PREFIX_CACHING: "0"
