name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install --upgrade pip pytest

      # Guards the stdlib-only promise. The cost model and the deploy gate must
      # run on a fresh clone with nothing installed: a gate that needs a package
      # index to decide whether a deploy is safe fails open on a bad network
      # day, which is the one time you most want it to work.
      - name: Core and gate need no dependencies
        run: |
          python -c "
          import bench.config, bench.metrics, bench.cost, bench.workloads
          import gate.compare, gate.record
          print('core and gate are dependency-free')
          "

      # Fast tests first, so a broken cost model fails in seconds rather than
      # after a minute of end-to-end HTTP.
      - name: Unit tests
        run: python -m pytest tests -q -m "not e2e"

      - name: Install the load generator's client
        run: python -m pip install "httpx>=0.27"

      # Drives the real client against a mock vLLM over real HTTP. Slow (~70s)
      # and worth every second: this is the only thing that checks the
      # instrument every published latency number comes from. It catches, among
      # others, counting vLLM's role-only first delta as the first token, and a
      # generator that has quietly become closed-loop.
      - name: End-to-end load generator tests
        run: python -m pytest tests -q -m "e2e"

      # The corpora are committed, so this checks they are present and still
      # the three distinct shapes the sweep assumes -- not that they can be
      # rebuilt, which needs Project 01 checked out.
      - name: Workload corpora are present and distinct
        run: python -m pytest tests/test_workloads.py -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check .

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pyyaml
        run: python -m pip install pyyaml

      # Catches a malformed manifest before it reaches a cluster. Cheap, and
      # a YAML error found at apply time costs a GPU block to rediscover.
      - name: Manifests and rules parse
        run: |
          python - <<'PY'
          import pathlib, sys, yaml

          bad = []
          checked = 0
          for path in sorted(pathlib.Path("deploy").rglob("*.y*ml")):
              checked += 1
              try:
                  list(yaml.safe_load_all(path.read_text()))
              except Exception as exc:
                  bad.append(f"{path}: {exc}")

          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print(f"{checked} manifest(s) parse")
          PY

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The entrypoint runs inside the container on every start. A quoting bug
      # here surfaces as a server that will not boot, discovered on rented time.
      - run: shellcheck serving/entrypoint.sh
