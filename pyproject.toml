[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-serving-unit-economics"
version = "0.1.0"
description = "Latency, quality and cost curves for serving one open-weight LLM"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# The core is stdlib-only, the same promise Project 01 makes and for the same
# reason: the cost model and the CI quality gate have to run on a fresh clone
# with nothing installed. A gate that needs a package index to decide whether a
# deploy is safe is a gate that fails open on a bad network day.
dependencies = []

[project.optional-dependencies]
# Only the load generator needs a client, and only because a Poisson arrival
# process wants real concurrency. Everything that reads its output is stdlib.
load = [
    "httpx>=0.27",
]
charts = [
    "matplotlib>=3.8",
]
# The quality gate scores against Project 01. Pinned to a commit, not a branch:
# a gate whose baseline can move underneath it is not a gate.
eval = [
    "gst-eval-harness @ git+https://github.com/ardhendudebnath/gst-eval-harness.git@099e9d1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # Only the tests need this, to read the alert rules and the k8s manifests
    # back and check them against what the code and the docs claim. Nothing
    # under bench/ or gate/ imports it -- the core stays dependency-free.
    #
    # It is declared because it was once not: tests/test_observability.py
    # skips its whole module without yaml, so the 27 tests holding the rules
    # and the dashboard together ran on one laptop and nowhere else.
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
include = ["bench*", "gate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# The end-to-end tests drive real HTTP against a mock server with real sleeps,
# so they take about a minute. They are the most valuable tests here and CI
# runs all of them; `-m "not e2e"` is for the fast local loop.
markers = [
    "e2e: drives the load generator over real HTTP (slow)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
